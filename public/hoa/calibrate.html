<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lot Zone Editor — Oakleaf Ridge Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #login-screen {
    position: fixed; inset: 0; background: #1a1a2e;
    display: flex; align-items: center; justify-content: center; z-index: 999;
  }
  #login-screen form { background: #16213e; padding: 2rem; border-radius: 12px; min-width: 280px; }
  #login-screen h2 { margin-bottom: 1rem; color: #4CAF50; }
  #login-screen input { width: 100%; padding: .6rem .8rem; border-radius: 6px; border: 1px solid #444; background: #0f3460; color: #fff; font-size: 1rem; margin-bottom: .75rem; }
  #login-screen button { width: 100%; padding: .7rem; background: #4CAF50; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
  #login-err { color: #f44; font-size: .85rem; margin-bottom: .5rem; display: none; }

  #toolbar {
    background: #16213e; padding: .5rem 1rem;
    display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
    border-bottom: 1px solid #0f3460; flex-shrink: 0;
  }
  #toolbar h1 { font-size: .95rem; color: #4CAF50; margin-right: .5rem; }
  .lot-select-label { font-size: .8rem; color: #aaa; }
  #lot-select { background: #0f3460; color: #fff; border: 1px solid #444; border-radius: 4px; padding: .3rem .5rem; font-size: .85rem; }
  .btn { padding: .35rem .8rem; border: none; border-radius: 5px; cursor: pointer; font-size: .82rem; font-weight: 600; }
  .btn-green  { background: #4CAF50; color: #fff; }
  .btn-blue   { background: #2196F3; color: #fff; }
  .btn-red    { background: #f44336; color: #fff; }
  .btn-gray   { background: #555; color: #fff; }
  #status-msg { font-size: .8rem; color: #aaa; margin-left: auto; }

  #editor-wrap {
    flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center;
    padding: .5rem;
  }
  #editor-svg-container {
    position: relative;
    width: min(90vw, 90vh);
    aspect-ratio: 1;
  }
  #editor-svg {
    width: 100%; height: 100%;
    display: block;
    border: 2px solid #333;
    touch-action: none;
  }

  .lot-poly {
    fill: rgba(255,255,100,0.08);
    stroke: rgba(255,255,0,0.5);
    stroke-width: 6;
    cursor: move;
    transition: fill .1s;
  }
  .lot-poly:hover  { fill: rgba(255,255,100,0.18); }
  .lot-poly.active { fill: rgba(255,200,0,0.25); stroke: #ffcc00; stroke-width: 8; }

  .lot-label {
    fill: rgba(255,255,0,0.7);
    font-size: 36px;
    font-weight: 700;
    pointer-events: none;
    font-family: system-ui, sans-serif;
  }
  .lot-label.active { fill: #ffcc00; }

  .corner-handle {
    fill: #fff;
    stroke: #ffcc00;
    stroke-width: 4;
    cursor: nwse-resize;
  }
  .corner-handle:hover { fill: #ffcc00; }
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <form id="login-form">
    <h2>Lot Zone Editor</h2>
    <p id="login-err">Wrong password</p>
    <input type="password" id="pwd-input" placeholder="Admin password" autocomplete="current-password">
    <button type="submit">Enter</button>
  </form>
</div>

<!-- Toolbar -->
<div id="toolbar">
  <h1>Lot Zone Editor</h1>
  <span class="lot-select-label">Active lot:</span>
  <select id="lot-select"></select>
  <button class="btn btn-blue" id="btn-prev">&#8592; Prev</button>
  <button class="btn btn-blue" id="btn-next">Next &#8594;</button>
  <button class="btn btn-green" id="btn-save">Save All</button>
  <button class="btn btn-gray" id="btn-reset-lot">Reset This Lot</button>
  <button class="btn btn-red" id="btn-reset-all">Reset All</button>
  <button class="btn btn-gray" id="btn-export">Export JSON</button>
  <span id="status-msg">Drag corners to reshape. Drag polygon to move.</span>
</div>

<!-- Map editor -->
<div id="editor-wrap">
  <div id="editor-svg-container">
    <svg id="editor-svg" viewBox="0 0 1092 1092" xmlns="http://www.w3.org/2000/svg">
      <image href="oakleaf-map.jpg" x="0" y="0" width="1092" height="1092" preserveAspectRatio="xMidYMid meet"/>
      <g id="poly-layer"></g>
      <g id="label-layer"></g>
      <g id="handle-layer"></g>
    </svg>
  </div>
</div>

<script>
const PASS = 'DougRemer86!';
document.getElementById('login-form').addEventListener('submit', e => {
  e.preventDefault();
  if (document.getElementById('pwd-input').value === PASS) {
    document.getElementById('login-screen').style.display = 'none';
    init();
  } else {
    document.getElementById('login-err').style.display = 'block';
  }
});

const STORAGE_KEY = 'hoa-lot-polygons';
function rect(x1,y1,x2,y2) { return [[x1,y1],[x2,y1],[x2,y2],[x1,y2]]; }
const DEFAULTS = {
   1: rect(  5,   8, 142, 330),
   2: rect(142, 157, 370, 406),
   3: rect(142,   8, 370, 157),
   4: rect(370,   8, 532, 157),
   5: rect(370, 157, 532, 406),
   6: rect(370, 406, 532, 551),
   7: rect(370, 551, 532, 790),
   8: rect(260, 406, 370, 551),
   9: rect(142, 406, 260, 551),
  10: rect(  5, 330, 142, 551),
  11: rect(  5, 551, 142, 957),
  12: rect(142, 551, 260, 790),
  13: rect(260, 551, 370, 790),
  14: rect(142, 790, 370, 957),
  15: rect(370, 790, 668, 957),
  16: rect(532, 630, 668, 790),
  17: rect(532, 551, 668, 630),
  18: rect(532, 292, 668, 551),
  19: rect(668, 292, 804, 551),
  20: rect(532, 157, 804, 292),
  21: rect(532,   8, 804, 157),
  22: rect(804,   8,1080, 157),
  23: rect(804, 157,1080, 292),
  24: rect(804, 292,1080, 406),
  25: rect(804, 406,1080, 551),
  26: rect(668, 551, 804, 790),
  27: rect(804, 790,1080, 957),
  28: rect(804, 551,1080, 790),
  29: rect(532, 957, 668,1082),
  30: rect(370, 957, 532,1082),
  31: rect(142, 957, 370,1082),
};

let zones = {};
let activeLot = 1;
const svg = document.getElementById('editor-svg');
const SVG_NS = 'http://www.w3.org/2000/svg';

function loadZones() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      const out = {};
      for (const k of Object.keys(DEFAULTS)) {
        out[k] = parsed[k] ? parsed[k].map(p => [...p]) : DEFAULTS[k].map(p => [...p]);
      }
      return out;
    }
  } catch(e) {}
  return Object.fromEntries(Object.entries(DEFAULTS).map(([k,v]) => [k, v.map(p=>[...p])]));
}

function saveZones() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(zones));
  showStatus('Saved ✓');
}

function showStatus(msg) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  setTimeout(() => { el.textContent = 'Drag corners to reshape. Drag polygon to move.'; }, 2000);
}

function ptsStr(pts) { return pts.map(p => p.join(',')).join(' '); }
function centroid(pts) {
  return [
    pts.reduce((s,p) => s+p[0], 0) / pts.length,
    pts.reduce((s,p) => s+p[1], 0) / pts.length,
  ];
}

function svgPt(e) {
  const pt = svg.createSVGPoint();
  const src = e.touches ? e.touches[0] : e;
  pt.x = src.clientX; pt.y = src.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

function makeSVG(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k,v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  return el;
}

function render() {
  document.getElementById('poly-layer').innerHTML = '';
  document.getElementById('label-layer').innerHTML = '';
  document.getElementById('handle-layer').innerHTML = '';

  const lots = Object.keys(zones).map(Number).sort((a,b) => a-b);

  for (const lotNum of lots) {
    const pts = zones[String(lotNum)];
    const isActive = lotNum === activeLot;
    const [cx, cy] = centroid(pts);

    const poly = makeSVG('polygon', { points: ptsStr(pts) });
    poly.classList.add('lot-poly');
    if (isActive) poly.classList.add('active');
    poly.dataset.lot = lotNum;
    document.getElementById('poly-layer').appendChild(poly);

    const label = makeSVG('text', { x: cx, y: cy, 'text-anchor': 'middle', 'dominant-baseline': 'middle' });
    label.classList.add('lot-label');
    if (isActive) label.classList.add('active');
    label.textContent = lotNum;
    document.getElementById('label-layer').appendChild(label);

    if (isActive) {
      pts.forEach(([hx, hy], idx) => {
        const h = makeSVG('circle', { cx: hx, cy: hy, r: 18 });
        h.classList.add('corner-handle');
        h.dataset.lot = lotNum;
        h.dataset.idx = idx;
        document.getElementById('handle-layer').appendChild(h);
      });
    }
  }

  document.getElementById('lot-select').value = activeLot;
}

// ── Drag handling ─────────────────────────────────────────────────────────────
let drag = null;

svg.addEventListener('mousedown', startDrag);
svg.addEventListener('touchstart', startDrag, { passive: false });
window.addEventListener('mousemove', moveDrag);
window.addEventListener('touchmove', moveDrag, { passive: false });
window.addEventListener('mouseup', endDrag);
window.addEventListener('touchend', endDrag);

function startDrag(e) {
  const el = e.target;

  if (el.classList.contains('corner-handle')) {
    e.preventDefault();
    drag = {
      type: 'corner',
      lotNum: Number(el.dataset.lot),
      idx: Number(el.dataset.idx),
    };
    return;
  }

  if (el.classList.contains('lot-poly')) {
    e.preventDefault();
    const lotNum = Number(el.dataset.lot);
    activeLot = lotNum;
    drag = {
      type: 'poly',
      lotNum,
      startPt: svgPt(e),
      startPts: zones[String(lotNum)].map(p => [...p]),
    };
    render();
  }
}

function moveDrag(e) {
  if (!drag) return;
  e.preventDefault();
  const cur = svgPt(e);

  if (drag.type === 'corner') {
    const pts = zones[String(drag.lotNum)];
    pts[drag.idx][0] = Math.round(Math.max(0, Math.min(1092, cur.x)));
    pts[drag.idx][1] = Math.round(Math.max(0, Math.min(1092, cur.y)));
    render();
  }

  if (drag.type === 'poly') {
    const dx = cur.x - drag.startPt.x;
    const dy = cur.y - drag.startPt.y;
    zones[String(drag.lotNum)] = drag.startPts.map(([x,y]) => [
      Math.round(Math.max(0, Math.min(1092, x + dx))),
      Math.round(Math.max(0, Math.min(1092, y + dy))),
    ]);
    render();
  }
}

function endDrag() {
  if (drag) { drag = null; saveZones(); }
}

// ── Toolbar ───────────────────────────────────────────────────────────────────
function buildSelect() {
  const sel = document.getElementById('lot-select');
  sel.innerHTML = '';
  for (let i = 1; i <= 31; i++) {
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = 'Lot ' + i;
    sel.appendChild(opt);
  }
}

document.getElementById('lot-select').addEventListener('change', e => {
  activeLot = Number(e.target.value); render();
});
document.getElementById('btn-prev').addEventListener('click', () => {
  activeLot = Math.max(1, activeLot - 1); render();
});
document.getElementById('btn-next').addEventListener('click', () => {
  activeLot = Math.min(31, activeLot + 1); render();
});
document.getElementById('btn-save').addEventListener('click', saveZones);
document.getElementById('btn-reset-lot').addEventListener('click', () => {
  if (!confirm('Reset Lot ' + activeLot + ' to default?')) return;
  zones[String(activeLot)] = DEFAULTS[activeLot].map(p => [...p]);
  saveZones(); render();
});
document.getElementById('btn-reset-all').addEventListener('click', () => {
  if (!confirm('Reset ALL lots to defaults?')) return;
  zones = Object.fromEntries(Object.entries(DEFAULTS).map(([k,v]) => [k, v.map(p=>[...p])]));
  saveZones(); render();
});
document.getElementById('btn-export').addEventListener('click', () => {
  const json = JSON.stringify(zones, null, 2);
  navigator.clipboard.writeText(json)
    .then(() => showStatus('JSON copied ✓'))
    .catch(() => { const w = window.open('','_blank'); w.document.write('<pre>'+json+'</pre>'); });
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { activeLot = Math.min(31, activeLot+1); render(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { activeLot = Math.max(1, activeLot-1); render(); }
  else if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveZones(); }
});

function init() {
  zones = loadZones();
  buildSelect();
  render();
}
</script>
</body>
</html>
